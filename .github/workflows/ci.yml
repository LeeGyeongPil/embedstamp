# Mock mode only: no API keys, no model downloads.
# core job (required): core dependencies (numpy) + pytest, then the demo and the quickstart example.
# extras job (manual): runs only from "Run workflow" in the Actions tab and installs the chroma extra.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==0.13.6"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -q -m "not timing"
      - name: Run demo
        run: uv run embedstamp demo
      - name: Run quickstart example
        run: uv run python examples/quickstart.py

  extras:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANONYMIZED_TELEMETRY: "False"
      EMBEDSTAMP_REQUIRE_CHROMA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==0.13.6"
      - name: Install locked dependencies with the chroma extra
        run: uv sync --locked --extra chroma
      - name: Run Chroma tests
        run: uv run --extra chroma pytest -q -rs -m chroma
